<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kanban — dsh-kanban</title>
  <link rel="stylesheet" href="/kanban/vendor/hermes-base.css" />
  <link rel="stylesheet" href="/kanban/dist/style.css" />
  <style>
    /* Host page scaffolding only; the board styles come from dist/style.css. */
    html, body { margin: 0; padding: 0; height: 100%; }
    #root { height: 100%; }
  </style>
  <script>
    /* Theme tokens: the Hermes board styles reference CSS vars like
       --color-foreground / --color-card / --color-border that the Hermes
       web shell normally defines. This standalone page must define them
       itself, matching the DSH host's light/dark scheme. The host marks
       its scheme with inline `color-scheme` on <html> (same origin, so we
       can read it directly); we fall back to the OS preference. */
    (function () {
      var dark = false;
      try {
        var p = window.parent;
        if (p && p.document && p.document.documentElement) {
          var host = p.document.documentElement;
          var cs = host.style.colorScheme || getComputedStyle(host).colorScheme;
          dark = cs === "dark";
        }
      } catch (e) {
        /* cross-origin guard — fall back to OS preference */
      }
      if (!dark && window.matchMedia) {
        try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
      }
      var root = document.documentElement;
      root.setAttribute("data-kb-theme", dark ? "dark" : "light");
      var vars = dark
        ? [
            "color-scheme: dark",
            "--color-foreground:#e4e6e9",
            "--color-muted-foreground:#9aa1a9",
            "--color-card:#171b20",
            "--color-card-foreground:#e4e6e9",
            "--color-border:rgba(255,255,255,0.14)",
            "--color-input:rgba(255,255,255,0.14)",
            "--color-ring:#4cc2ff",
            "--hermes-diag-critical:#fb2c36",
            "--hermes-diag-error:#fb2c36",
            "--hermes-diag-warning:#ffbd38",
            "--radius:10px",
            "--ui-bg:#0f1115",
          ]
        : [
            "color-scheme: light",
            "--color-foreground:#1c1f24",
            "--color-muted-foreground:#5c6470",
            "--color-card:#ffffff",
            "--color-card-foreground:#1c1f24",
            "--color-border:rgba(0,0,0,0.12)",
            "--color-input:rgba(0,0,0,0.12)",
            "--color-ring:#0a7cff",
            "--hermes-diag-critical:#d92d20",
            "--hermes-diag-error:#d92d20",
            "--hermes-diag-warning:#b54708",
            "--radius:10px",
            "--ui-bg:#f6f7f9",
          ];
      var style = document.createElement("style");
      style.textContent =
        ":root{" + vars.join(";") + "}" +
        "html,body{background:var(--ui-bg,#0f1115)}" +
        "body{color:var(--color-foreground)}";
      document.head.appendChild(style);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__HERMES_SESSION_TOKEN__ = "__DSH_KANBAN_TOKEN__";
  </script>
  <script src="/kanban/vendor/react.production.min.js"></script>
  <script src="/kanban/vendor/react-dom.production.min.js"></script>
  <script>
    (function () {
      "use strict";
      var React = window.React;
      var ReactDOM = window.ReactDOM;
      var h = React.createElement;
      var TOKEN = window.__HERMES_SESSION_TOKEN__ || "";

      /* --- utils --------------------------------------------------------- */
      function cn() {
        var out = [];
        for (var i = 0; i < arguments.length; i++) {
          var a = arguments[i];
          if (!a) continue;
          if (typeof a === "string") out.push(a);
          else if (Array.isArray(a)) out.push(cn.apply(null, a));
          else if (typeof a === "object") {
            for (var k in a) if (a[k]) out.push(k);
          }
        }
        return out.join(" ");
      }
      function timeAgo(ts) {
        if (!ts) return "";
        var now = Date.now();
        var diff = Math.max(0, now - Number(ts));
        var s = Math.floor(diff / 1000);
        if (s < 60) return s + "s";
        var m = Math.floor(s / 60);
        if (m < 60) return m + "m";
        var hr = Math.floor(m / 60);
        if (hr < 24) return hr + "h";
        var d = Math.floor(hr / 24);
        return d + "d";
      }

      /* --- components (thin shadcn-style shims the dist bundle expects) --- */
      function pass(tag, base) {
        return function (props) {
          var p = Object.assign({}, props);
          var cls = cn(base, props && props.className);
          p.className = cls;
          if (tag === "button") p.type = p.type || "button";
          return h(tag, p);
        };
      }
      var components = {
        Card: pass("div", ""),
        CardContent: pass("div", ""),
        Badge: pass("span", ""),
        Button: pass("button", ""),
        Input: pass("input", ""),
        Label: pass("label", ""),
        Select: pass("select", ""),
        SelectOption: function (props) {
          var p = Object.assign({}, props);
          var v = p.value; delete p.value;
          return h("option", Object.assign({ value: v }, p));
        }
        /* Checkbox intentionally absent: the bundle ships its own native
           fallback when SDK.components.Checkbox is missing. */
      };

      /* --- network -------------------------------------------------------- */
      function authHeaders(extra) {
        var headers = Object.assign({}, extra);
        if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
        return headers;
      }
      function fetchJSON(url, opts) {
        opts = opts || {};
        var headers = authHeaders(opts.headers || {});
        var body = opts.body;
        if (typeof body === "string" && !headers["content-type"]) {
          headers["content-type"] = "application/json";
        }
        return fetch(url, Object.assign({}, opts, { headers: headers })).then(function (r) {
          var p = r.json().catch(function () { return null; });
          if (!r.ok) {
            return p.then(function (e) {
              var detail = e && (e.detail || e.error) ? (e.detail || e.error) : "HTTP " + r.status;
              throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
            });
          }
          return p;
        });
      }
      function authedFetch(url, opts) {
        opts = opts || {};
        return fetch(url, Object.assign({}, opts, { headers: authHeaders(opts.headers || {}) }));
      }
      function buildWsUrl(path, params) {
        return Promise.resolve().then(function () {
          var u = new URL(path, window.location.origin);
          u.protocol = u.protocol === "https:" ? "wss:" : "ws:";
          if (TOKEN) u.searchParams.set("token", TOKEN);
          if (params) for (var k in params) u.searchParams.set(k, String(params[k]));
          return u.toString();
        });
      }

      /* --- plugin SDK + registry ----------------------------------------- */

      var ZH = {

        parents: "父任务：",
        pickProfileFirst: "请先选择档案。",

        projectDirectory: "项目目录",
        projectDirectoryExplanation: "任务的工作目录",
        projectDirectoryHelp: "项目目录帮助",
        projectDirectoryHint: "（推荐）",

        reassignFailed: "重新指派失败：",

        removeDependency: "移除依赖",
        renderingError: "看板渲染出错",
        runHistory: "运行历史",
        save: "保存",
        saving: "保存中…",
        search: "搜索",
        selected: "已选",
        sendNotifications: "完成 / 阻塞 / 放弃时通知",
        sendingUpdates: "正在发送更新至",
        setPriority: "设置优先级",
        show: "显示",
        showAllAttempts: "显示全部尝试",
        showArchived: "显示已归档",

        skillsLabelHint: "（可选，逗号分隔）",

        slugHint: "— 小写连字符，如 atm10-server",

        taskNeedsAttention: "1 个任务需要关注",
        taskTitleLabel: "标题",
        taskTitlePlaceholder: "新任务标题…",
        tasksNeedAttention: "个任务需要关注",
        tenant: "租户",
        trash: {
          confirm: "删除此任务？",
          confirmMany: "删除所选任务？",
          dropHint: "拖到此处删除",
        },
        triagePlaceholder: "粗略想法 — AI 将细化…",
        unassigned: "未指派",
        unblock: "解除阻塞",
        unblockFailed: "解除阻塞失败：",
        unblockedMessage: "已解除阻塞",
        untitled: "（无标题）",
        workerLog: "Worker 日志",
        workspace: "工作区",
        workspaceDir: "目录 — 保留",
        workspacePathDir: "工作区路径（无看板工作目录时必填）",
        workspacePathOptional: "工作区路径（可选）",
        workspaceScratch: "临时 — 完成后删除",
        workspaceScratchWarning: "临时工作区完成后将被删除",
        workspaceWorktree: "工作树",
        wsAuthFailed: "WebSocket 认证失败",
      };

      /* Hardcoded English strings the bundle renders outside tx() (column
         names, column help, header bits). Replaced on the rendered DOM. */
      var ZH_PLAIN = {
        "Triage": "待梳理", "Todo": "待办", "scheduled": "已排期",
        "Ready": "就绪", "In Progress": "进行中", "Blocked": "阻塞",
        "Review": "待评审", "Done": "已完成", "Completed": "已完成",
        "Raw ideas — a specifier will flesh out the spec": "粗略想法 — AI 将细化规格",
        "Waiting on dependencies or unassigned": "等待依赖或指派",
        "Dependencies satisfied; assign a profile to dispatch": "依赖就绪，指派档案即可派发",
        "Claimed by a worker — in-flight": "已被 worker 认领 — 执行中",
        "Worker asked for human input": "需要人工输入",
        "Implementation complete — awaiting review": "实现完成 — 待评审",
        "Switch kanban board": "切换看板",
        "Hermes Kanban documentation": "看板文档",
      };

      function zhReplace(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var n;
        while ((n = walker.nextNode())) {
          if (!n.nodeValue) continue;
          var v = ZH_PLAIN[n.nodeValue.trim()];
          if (v !== undefined) n.nodeValue = v;
        }
      }

      window.__HERMES_PLUGIN_SDK__ = {
        React: React,
        hooks: {
          useState: React.useState,
          useEffect: React.useEffect,
          useCallback: React.useCallback,
          useMemo: React.useMemo,
          useRef: React.useRef
        },
        useI18n: function () {
          return { t: { kanban: ZH }, locale: "zh" };
        },
        components: components,
        utils: { cn: cn, timeAgo: timeAgo },
        fetchJSON: fetchJSON,
        authedFetch: authedFetch,
        buildWsUrl: buildWsUrl
      };
      window.__HERMES_PLUGINS__ = {
        register: function (name, Component) {
          var rootEl = document.getElementById("root");
          ReactDOM.createRoot(rootEl).render(h(Component));
          var mo = new MutationObserver(function () {
            zhReplace(rootEl);
          });
          mo.observe(rootEl, { childList: true, subtree: true });
          zhReplace(rootEl);
        }
      };
    })();
  </script>
  <script src="/kanban/dist/index.js"></script>
